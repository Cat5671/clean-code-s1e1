<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body class="page">
    <aside class="eisenhower-matrix">
      <div class="eisenhower-matrix__container">
        <img class="eisenhower-matrix__img" src="./eisenhower-matrix.jpg" alt="eisenhower-matrix">
        <a class="eisenhower-matrix__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
      </div>
    </aside>
    <main class="main">
      <div class="main__container">
        <section class="add-tasks-section">
          <p class="add-tasks-section__container">
            <label class="add-tasks-section__label" for="new-task">Add Item</label>
            <div class="add-tasks-section__task-wrapper">
              <input id="new-task" class="add-tasks-section__input task" type="text">
              <button class="button">Add</button>
            </div>
          </p>
        </section>
        <section class="incomplete-tasks-section">
          <h3 class="title">Todo</h3>
          <ul id="incomplete-tasks" class="incomplete-tasks-section__list list-tasks">
            <li class="list-tasks__task">
              <input class="list-tasks__checkbox" type="checkbox">
              <label class="list-tasks__aim task">Pay Bills</label>
              <input class="list-tasks__edit-input task" type="text">
              <button class="edit-button button">Edit</button>
              <button class="delete-button button">
                <img class="delete-button__img" src="./remove.svg" alt="remove">
              </button>
            </li>
            <li class="list-tasks__task edit-mode">
              <input class="list-tasks__checkbox" type="checkbox">
              <label class="list-tasks__aim task">Go Shopping</label>
              <input class="list-tasks__edit-input task" type="text" value="Go Shopping">
              <button class="edit-button button">Save</button>
              <button class="delete-button button">
                <img class="delete-button__img" src="./remove.svg" alt="remove">
              </button>
            </li>
          </ul>
        </section>
        <section class="completed-tasks-section">
          <h3 class="title">Completed</h3>
          <ul id="completed-tasks" class="completed-tasks-section__list list-tasks">
            <li class="list-tasks__task">
              <input class="list-tasks__checkbox" type="checkbox" checked>
              <label class="list-tasks__aim task">See the Doctor</label>
              <input class="list-tasks__edit-input task" type="text">
              <button class="edit-button button">Edit</button>
              <button class="delete-button button">
                <img class="delete-button__img" src="./remove.svg" alt="remove">
              </button>
            </li>
          </ul>
        </section>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
